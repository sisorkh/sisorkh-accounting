{% extends "base.html" %}

{% block content %}
<h2>📦 افزودن کالای جدید</h2>
<form method="post" action="/goods/add">
    <fieldset style="border:1px solid #ccc; padding:15px; margin-bottom:20px;">
        <legend>اطلاعات پایه</legend>
        
        <label>کتاب:</label><br>
        <select name="book" required style="width:100%; margin-bottom:10px;">
            <option value="">-- انتخاب کنید --</option>
            {% for b in books %}
            <option value="{{ b.id }}">{{ b.name }} {% if b.second %}({{ b.second }}){% endif %}</option>
            {% endfor %}
        </select><br>
        
        <label>شابک (ISBN 13 رقمی, اختیاری):</label><br>
        <input type="text" name="isbn" placeholder="مثال: 9789640000000" style="width:100%; margin-bottom:10px;"><br>
        
        <label>نوع جلد:</label><br>
        <select name="cover" required style="width:100%; margin-bottom:10px;">
            <option value="0">شومیز</option>
            <option value="1">گالینگور</option>
            <option value="2">شومیز قاب‌دار</option>
            <option value="3">گالینگور قاب‌دار</option>
            <option value="7">نامشخص</option>
        </select><br>
        
        <label>قطع کتاب:</label><br>
        <select name="size" required style="width:100%; margin-bottom:10px;">
            <option value="0">رقعی</option>
            <option value="1">جیبی</option>
            <option value="2">پالتویی</option>
            <option value="3">وزیری</option>
            <option value="4">رحلی</option>
            <option value="5">نقلی</option>
            <option value="6">خشتی</option>
            <option value="7">نامشخص</option>
        </select><br>
        
        <label>نوبت چاپ (عدد):</label><br>
        <input type="number" name="number" value="1" style="width:100%; margin-bottom:10px;"><br>
        
        <label>شمارگان (تیراژ):</label><br>
        <input type="number" name="tirage" value="0" style="width:100%; margin-bottom:10px;"><br>
        
        <label>تعداد صفحات:</label><br>
        <input type="number" name="page" value="0" style="width:100%; margin-bottom:10px;"><br>
        
        <label>وزن (گرم):</label><br>
        <input type="number" name="weight" value="0" style="width:100%; margin-bottom:10px;"><br>
        
        <label>سال چاپ:</label><br>
        <input type="number" name="year" value="{{ default_year }}" style="width:100%; margin-bottom:10px;"><br>
    </fieldset>
    
    <div style="text-align:center;">
        <button type="submit" class="btn-add">💾 ذخیره کالا</button>
        <a href="/goods/view" class="btn-view">🔙 بازگشت</a>
    </div>
</form>
{% endblock %}
