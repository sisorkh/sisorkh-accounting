{% extends "base.html" %}

{% block content %}
<h2>📥 ثبت خرید جدید</h2>
<form method="post" action="/purchase/add" id="purchaseForm">
    <fieldset style="border:1px solid #ccc; padding:15px; margin-bottom:20px;">
        <legend>اطلاعات فاکتور خرید</legend>
        <label>مخاطب (تأمین‌کننده):</label><br>
        <select name="contact" required style="width:100%; margin-bottom:10px;">
            <option value="">-- انتخاب کنید --</option>
            {% for c in contacts %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select><br>
        
        <label>انبار مقصد:</label><br>
        <select name="warehouse" required style="width:100%; margin-bottom:10px;">
            <option value="">-- انتخاب کنید --</option>
            {% for w in warehouses %}<option value="{{ w.id }}">{{ w.contact_name }} (انبار کد {{ w.id }})</option>{% endfor %}
        </select><br>
        
        <label>توضیحات (اختیاری):</label><br>
        <textarea name="description" rows="2" style="width:100%; margin-bottom:10px;"></textarea><br>
        
        <label>روش ارسال:</label><br>
        <select name="shipping_method" required style="width:100%; margin-bottom:10px;">
            <option value="0">حضوری</option><option value="1">پست</option><option value="2">باربری/پخش</option>
            <option value="3">پیک</option><option value="4">سایر</option>
        </select><br>
        
        <label>هزینه ارسال (تومان):</label><br>
        <input type="number" name="shipping_cost" value="0" style="width:100%; margin-bottom:10px;"><br>
        
        <label><input type="checkbox" name="final" checked> فاکتور نهایی </label>
        <label> <input type="checkbox" name="register_payment" checked> ثبت پرداخت </label>
    </fieldset>
    
    <fieldset style="border:1px solid #ccc; padding:15px; margin-bottom:20px;">
        <legend>کالاهای خریداری شده</legend>
        <div style="overflow-x:auto;">
            <table id="itemsTable" style="width:100%; border-collapse:collapse;">
                <thead><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد (تومان)</th><th>تخفیف (٪)</th><th>مجموع</th><th>نوبت چاپ جدید؟</th><th>عملیات</th></tr></thead>
                <tbody id="itemsBody"></tbody>
                <tfoot>
                    <tr><td colspan="6"><button type="button" id="addItemBtn" class="btn-add">➕ افزودن کالا</button></td><td><span id="totalItemsAmount">0</span> تومان</td></tr>
                </tfoot>
            </table>
        </div>
    </fieldset>
    
    <div style="text-align:center;">
        <button type="submit" class="btn-add">💾 ثبت فاکتور خرید</button>
        <a href="/purchase/view" class="btn-view">🔙 بازگشت</a>
    </div>
</form>

<script>
    const goodsData = [
        {% for g in goods %}
        { id: {{ g.id }}, name: "{{ g.book_name }} (شابک: {{ g.isbn or 'ندارد' }}, قیمت: {{ g.price }})", price: 0 },
        {% endfor %}
    ];
    

    function calculateRowTotal(row) {
       const number = parseFloat(row.querySelector('.item-number').value) || 0;
       const price = parseFloat(row.querySelector('.item-price').value) || 0;
       const discountPercent = parseFloat(row.querySelector('.item-discount').value) || 0;
       const total = number * price * (1 - discountPercent / 100);
       row.querySelector('.row-total').textContent = total.toLocaleString();
       return total;
    }

    function updateTotalAmount() {
       let total = 0;
       document.querySelectorAll('#itemsBody .item-row').forEach(row => {
           const number = parseFloat(row.querySelector('.item-number').value) || 0;
           const price = parseFloat(row.querySelector('.item-price').value) || 0;
           const discountPercent = parseFloat(row.querySelector('.item-discount').value) || 0;
           total += number * price * (1 - discountPercent / 100);
       });
       document.getElementById('totalItemsAmount').innerText = total.toLocaleString();
    }
    
    function addItemRow(goodsId, numberVal, priceVal, discountVal) {
        const tbody = document.getElementById('itemsBody');
        const row = document.createElement('tr');
        row.className = 'item-row';
        row.innerHTML = `
            <td><select name="goods_id[]" class="item-goods" required style="width:100%;">
                <option value="">-- انتخاب کالا --</option>
                ${goodsData.map(g => `<option value="${g.id}" data-price="${g.price}" ${g.id == goodsId ? 'selected' : ''}>${g.name}</option>`).join('')}
            </select></td>
            <td><input type="number" name="number[]" class="item-number" value="${numberVal || 1}" min="1" style="width:80px;"></td>
            <td><input type="number" name="price[]" class="item-price" value="${priceVal || 0}" min="0" style="width:120px;"></td>
            <td><input type="number" name="discount[]" class="item-discount" value="0" min="0" max="100" step="1" style="width:80px;"></td>
            <td class="row-total" style="text-align:center;">0</td>
            <td style="text-align:center;">
                <input type="checkbox" class="item-newprint-cb" title="اگر تیک بخورد، یک نوبت چاپ تازه برای این کالا ساخته می‌شود؛ در غیر این صورت به نوبت چاپ فعلی این کالا اضافه می‌شود.">
                <input type="hidden" name="new_print[]" class="item-newprint" value="0">
            </td>
            <td><button type="button" class="remove-row" style="background:#a00; color:white; border:none; padding:5px 10px;">حذف</button></td>
        `;
        const goodsSelect = row.querySelector('.item-goods');
        const numberInput = row.querySelector('.item-number');
        const priceInput = row.querySelector('.item-price');
        const discountInput = row.querySelector('.item-discount');
        const removeBtn = row.querySelector('.remove-row');
        const newPrintCb = row.querySelector('.item-newprint-cb');
        const newPrintHidden = row.querySelector('.item-newprint');
        
        newPrintCb.addEventListener('change', () => {
            newPrintHidden.value = newPrintCb.checked ? '1' : '0';
        });
        
        goodsSelect.addEventListener('change', () => {
            const opt = goodsSelect.options[goodsSelect.selectedIndex];
            priceInput.value = opt.getAttribute('data-price') || 0;
            calculateRowTotal(row); updateTotalAmount();
        });
        numberInput.addEventListener('input', () => { calculateRowTotal(row); updateTotalAmount(); });
        priceInput.addEventListener('input', () => { calculateRowTotal(row); updateTotalAmount(); });
        discountInput.addEventListener('input', () => { calculateRowTotal(row); updateTotalAmount(); });
        removeBtn.addEventListener('click', () => { row.remove(); updateTotalAmount(); });
        
        tbody.appendChild(row);
        calculateRowTotal(row);
        updateTotalAmount();
        if(goodsId) goodsSelect.dispatchEvent(new Event('change'));
    }
    
    document.getElementById('addItemBtn').addEventListener('click', () => addItemRow(null, 1, 0, 0));
    addItemRow(null, 1, 0, 0);  // یک ردیف خالی اولیه
    
    document.getElementById('purchaseForm').addEventListener('submit', (e) => {
        let valid = true;
        document.querySelectorAll('.item-row').forEach(row => {
            if(!row.querySelector('.item-goods').value) {
                alert('لطفاً برای همه ردیف‌ها کالا انتخاب کنید.');
                valid = false;
                e.preventDefault();
            }
        });
        if(!valid) e.preventDefault();
    });
</script>
{% endblock %}
