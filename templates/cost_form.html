{% extends "base.html" %}

{% block content %}
<h2>📉 ثبت هزینه جدید</h2>
<form method="post" action="/cost/add">
    <fieldset style="border:1px solid #ccc; padding:15px; margin-bottom:20px;">
        <legend>اطلاعات هزینه</legend>
        
        <label>کتاب:</label><br>
        <select name="book" required style="width:100%; margin-bottom:10px;">
            <option value="">-- انتخاب کنید --</option>
            <option value="0">هزینه‌ی کلی</option>
            {% for b in books %}
            <option value="{{ b.id }}">{{ b.name }} {% if b.second %}({{ b.second }}){% endif %}</option>
            {% endfor %}
        </select><br>
        
        <label>توضیحات:</label><br>
        <textarea name="description" rows="3" style="width:100%; margin-bottom:10px;" placeholder="مثال: هزینه چاپ، صحافی، ..."></textarea><br>
        
        <label>نوع هزینه:</label><br>
        <select name="cost_type" required style="width:100%; margin-bottom:10px;">
            <option value="pay">پرداخت (هزینه‌ای که بابت کتاب پرداخت کرده‌ایم)</option>
            <option value="receive">دریافت (هزینه‌ای که بابت کتاب دریافت کرده‌ایم)</option>
        </select><br>
        
        <label>مبلغ (تومان):</label><br>
        <input type="number" name="amount" required placeholder="فقط عدد مثبت وارد کنید" min="0" style="width:100%; margin-bottom:10px;"><br>
        <small style="color:gray;">مبلغ را بدون علامت وارد کنید. نوع هزینه را از بالا انتخاب کنید.</small>
    </fieldset>
    
    <div style="text-align:center;">
        <button type="submit" class="btn-add">💾 ثبت هزینه</button>
        <a href="/cost/view" class="btn-view">🔙 بازگشت</a>
    </div>
</form>
{% endblock %}
